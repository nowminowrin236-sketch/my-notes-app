<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"></head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Study Notes</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff5f8;color:#333}
header{background:#e88ca8;color:white;padding:25px 20px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.container{max-width:800px;margin:auto;padding:20px}
button{border:none;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:15px}
.add-btn{background:#e88ca8;color:white;width:100%;margin-bottom:15px}
input,textarea,select{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #ddd;border-radius:10px;font-size:15px}
textarea{min-height:180px;resize:vertical}
.search{margin-bottom:15px}
.note{background:white;padding:18px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 8px #00000012}
.note h3{margin-top:0}
.note small{color:#888}
.note-buttons{margin-top:12px}
.edit{background:#eee}.delete{background:#ffdddd}.save{background:#e88ca8;color:white;width:100%}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>📚 My Study Notes</h1><p>Your personal study space</p></header>
<div class="container">
<button class="add-btn" onclick="showForm()">➕ Add New Note</button>
<input class="search" type="text" id="search" placeholder="🔍 Search your notes..." oninput="displayNotes()">
<div id="form" class="hidden">
<h2>📝 Add Note</h2>
<label>Subject</label><input id="subject" placeholder="Example: Marketing">
<label>Topic</label><input id="topic" placeholder="Example: 4P">
<label>Your Notes</label><textarea id="notes" placeholder="Copy and paste your study materials here..."></textarea>
<label>Favourite</label>
<select id="favourite"><option value="No">No</option><option value="Yes">⭐ Yes</option></select>
<button class="save" onclick="saveNote()">💾 Save Note</button>
</div>
<hr><div id="notesList"></div>
</div>
<script>
let notes=JSON.parse(localStorage.getItem("studyNotes"))||[],editIndex=-1;
function showForm(){document.getElementById("form").classList.remove("hidden");window.scrollTo(0,0)}
function saveNote(){
let subject=document.getElementById("subject").value,topic=document.getElementById("topic").value,noteText=document.getElementById("notes").value,favourite=document.getElementById("favourite").value;
if(!subject||!topic||!noteText){alert("Please fill in Subject, Topic and Notes.");return}
let newNote={subject,topic,notes:noteText,favourite};
if(editIndex===-1)notes.push(newNote);else{notes[editIndex]=newNote;editIndex=-1}
localStorage.setItem("studyNotes",JSON.stringify(notes));
document.getElementById("subject").value="";document.getElementById("topic").value="";document.getElementById("notes").value="";document.getElementById("favourite").value="No";
document.getElementById("form").classList.add("hidden");displayNotes()
}
function displayNotes(){
let list=document.getElementById("notesList"),search=document.getElementById("search").value.toLowerCase();list.innerHTML="";
notes.forEach((note,index)=>{
let text=(note.subject+" "+note.topic+" "+note.notes).toLowerCase();if(!text.includes(search))return;
let card=document.createElement("div");card.className="note";
card.innerHTML=`<h3>${note.favourite==="Yes"?"⭐ ":""}${note.topic}</h3><small>📚 ${note.subject}</small><p>${note.notes.replace(/\n/g,"<br>")}</p><div class="note-buttons"><button class="edit" onclick="editNote(${index})">✏️ Edit</button> <button class="delete" onclick="deleteNote(${index})">🗑️ Delete</button></div>`;
list.appendChild(card)
})
}
function editNote(index){let note=notes[index];document.getElementById("subject").value=note.subject;document.getElementById("topic").value=note.topic;document.getElementById("notes").value=note.notes;document.getElementById("favourite").value=note.favourite;editIndex=index;showForm()}
function deleteNote(index){if(confirm("Delete this note?")){notes.splice(index,1);localStorage.setItem("studyNotes",JSON.stringify(notes));displayNotes()}}
displayNotes();
</script>
</body>
</html>
